name: MIPS Wasm to Github Pages

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Clang, LLD, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.6'

      - name: Build MIPS WebAssembly
        run: |
          xmake f -p wasm -a wasm32 --toolchain=wasm32-clang -m release -y -vD
          xmake -y

      - name: Prepare Web files
        run: |
          mkdir dist
          cp index.html dist/
          cp build/mips.wasm dist/mips.wasm

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job 2
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
